- name: Install Java
  apt:
    name: openjdk-17-jdk
    state: present

- name: Add Jenkins GPG key
  apt_key:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    state: present

- name: Add Jenkins repository
  apt_repository:
    repo: deb https://pkg.jenkins.io/debian-stable binary/
    state: present

- name: Install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: yes

- name: Start Jenkins
  systemd:
    name: jenkins
    state: started
    enabled: yes

- name: Wait for Jenkins to start
  wait_for:
    port: 8080
    delay: 10

- name: Get Jenkins initial admin password
  command: cat /var/lib/jenkins/secrets/initialAdminPassword
  register: jenkins_password

- name: Display Jenkins password
  debug:
    msg: "Jenkins initial password: {{ jenkins_password.stdout }}"

- name: Install Docker for Jenkins
  include_role:
    name: docker

- name: Add Jenkins user to docker group
  user:
    name: jenkins 
    groups: docker
    append: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu 
    groups: docker
    append: yes

- name: Install kubectl for Jenkins
  get_url:
    url: https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl
    dest: /usr/local/bin/kubectl
    mode: '0755'

- name: Copy kubeconfig to Jenkins
  copy:
    src: /tmp/admin.conf  # Fetched from master
    dest: /var/lib/jenkins/.kube/config
    owner: jenkins
    group: jenkins
    mode: '0600'