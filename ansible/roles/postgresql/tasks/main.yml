- name: Install PostgreSQL
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present

- name: Start PostgreSQL
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: Create database
  become: yes
  become_user: postgres
  become_flags: "-n"
  postgresql_db:
    name: ecommerce_db
    state: present

- name: Create database user
  become: yes
  become_user: postgres
  become_flags: "-n"
  postgresql_user:
    name: ecommerce_user
    password: SecurePassword123!
    priv: "ecommerce_db:ALL"
    state: present

- name: Configure PostgreSQL to listen on all interfaces
  lineinfile:
    path: /etc/postgresql/15/main/postgresql.conf
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '*'"

- name: Configure pg_hba.conf for remote access
  blockinfile:
    path: /etc/postgresql/15/main/pg_hba.conf
    block: |
      host    all             all             10.0.10.0/24            md5
      host    all             all             10.0.11.0/24            md5

- name: Restart PostgreSQL
  systemd:
    name: postgresql
    state: restarted