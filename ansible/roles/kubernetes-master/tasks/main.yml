- name: Ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Kubernetes GPG key (v1.32)
  get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
    dest: /tmp/kubernetes-release.key
    mode: '0644'

- name: Convert Kubernetes GPG key to keyring format
  command: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes repository to APT sources (v1.32)
  copy:
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: '0644'

- name: Update APT package index for Kubernetes
  apt:
    update_cache: true

- name: Install Kubernetes packages
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes

- name: Hold Kubernetes packages
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Initialize Kubernetes cluster
  command: >
    kubeadm init
    --pod-network-cidr={{ k8s_pod_network_cidr }}
    --apiserver-advertise-address={{ ansible_host }}
    --control-plane-endpoint={{ k8s_api_endpoint }}
    --upload-certs
  register: kubeadm_init
  retries: 2
  delay: 10
  until: kubeadm_init.rc == 0
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directory for admin user
  file:
    path: /home/{{ k8s_user }}/.kube
    state: directory
    mode: '0755'
    owner: "{{ k8s_user }}"
    group: "{{ k8s_user }}"

- name: Copy admin.conf to user kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ k8s_user }}/.kube/config
    remote_src: yes
    owner: "{{ k8s_user }}"
    group: "{{ k8s_user }}"
    mode: '0644'

- name: Install Calico CNI
  become: yes
  become_user: "{{ k8s_user }}"
  command: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
  environment:
    KUBECONFIG: /home/{{ k8s_user }}/.kube/config
  run_once: true

