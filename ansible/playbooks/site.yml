---
- name: Setup Docker/containerd
  hosts: k8s_cluster
  become: yes
  roles:
    - master-worker-conf

- name: Setup Kubernetes master
  hosts: k8s_master
  become: yes
  roles:
    - kubernetes-master

- name: Setup Kubernetes workers
  hosts: k8s_workers
  become: yes
  roles:
    - kubernetes-worker

- name: Setup containerd registry
  hosts: k8s_cluster
  become: yes
  roles:
    - containerd-registry





