- name: Setup common configuration
  hosts: all
  become: yes
  roles:
    - common

- name: Setup Docker/containerd
  hosts: k8s_cluster
  become: yes
  roles:
    - docker

- name: Setup Kubernetes master
  hosts: k8s_master
  become: yes
  roles:
    - kubernetes-master

- name: Setup Kubernetes workers
  hosts: k8s_workers
  become: yes
  roles:
    - kubernetes-worker

- name: Setup Jenkins
  hosts: jenkins_server
  become: yes
  roles:
    - jenkins

- name: Setup Nexus
  hosts: nexus_server
  become: yes
  roles:
    - nexus

- name: Setup PostgreSQL
  hosts: database
  become: yes
  roles:
    - postgresql