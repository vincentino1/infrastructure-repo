# Docker Repositories
- name: Create myapp-docker-hosted
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/docker/hosted"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    body_format: json
    body: |
      {
        "name": "{{ repo_prefix }}docker-hosted",
        "online": true,
        "storage": { "blobStoreName": "default", "strictContentTypeValidation": true, "writePolicy": "ALLOW" },
        "docker": { "v1Enabled": false, "forceBasicAuth": true, "httpPort": null, "httpsPort": null }
      }
    status_code: [201, 400]
    force_basic_auth: true


- name: Create myapp-docker-proxy
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/repositories/docker/proxy"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    body_format: json
    body: |
      {
        "name": "{{ repo_prefix }}docker-proxy",
        "online": true,
        "storage": { "blobStoreName": "default", "strictContentTypeValidation": true },
        "docker": { "v1Enabled": false, "httpPort": 5000 }
        "proxy": { "remoteUrl": "https://registry-1.docker.io", "contentMaxAge": 1440, "metadataMaxAge": 1440 },
        "negativeCache": { "enabled": true, "timeToLive": 1440 },
        "httpClient": { "blocked": false, "autoBlock": true, "httpPort": null, "httpsPort": null }
      }
    status_code: [201, 400]
    force_basic_auth: true

- name: Create myapp-docker-group
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/docker/group"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    body_format: json
    body: |
      {
        "name": "{{ repo_prefix }}docker-group",
        "online": true,
        "storage": { "blobStoreName": "default", "strictContentTypeValidation": true },
        "group": { "memberNames": ["{{ repo_prefix }}docker-hosted", "{{ repo_prefix }}docker-proxy"] },
        "docker": { "v1Enabled": false, "forceBasicAuth": true, "httpPort": null, "httpsPort": null }
      }
    status_code: [201, 400]
    force_basic_auth: true

