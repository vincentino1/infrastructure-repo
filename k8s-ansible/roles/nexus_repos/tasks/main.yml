# Docker Repositories
- name: Check docker-hosted repo
  uri:
    url: "{{ nexus_repo_api }}/docker-hosted/{{ repo_prefix }}docker-hosted"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: docker_hosted
  changed_when: false

- name: Create docker-hosted
  uri:
    url: "{{ nexus_repo_api }}/docker/hosted"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ repo_prefix }}docker-hosted"
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: true
        writePolicy: ALLOW
      docker:
        v1Enabled: false
        forceBasicAuth: true
        httpPort: "{{ docker_port }}"
    status_code: 201
  when: docker_hosted.status == 404

- name: Check docker-proxy repo
  uri:
    url: "{{ nexus_repo_api }}/docker-proxy/{{ repo_prefix }}docker-proxy"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: docker_proxy
  changed_when: false

- name: Create docker-proxy
  uri:
    url: "{{ nexus_repo_api }}/docker/proxy"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ repo_prefix }}docker-proxy"
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: true
      proxy:
        remoteUrl: https://registry-1.docker.io
        contentMaxAge: 1440
        metadataMaxAge: 1440
      negativeCache:
        enabled: true
        timeToLive: 1440
      httpClient:
        blocked: false
        autoBlock: true
      docker:
        v1Enabled: false
        forceBasicAuth: true
    status_code: 201
  when: docker_proxy.status == 404

- name: Check docker-group repo
  uri:
    url: "{{ nexus_repo_api }}/docker-group/{{ repo_prefix }}docker-group"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: docker_group
  changed_when: false

- name: Create docker-group
  uri:
    url: "{{ nexus_repo_api }}/docker/group"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ repo_prefix }}docker-group"
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: true
      group:
        memberNames:
          - "{{ repo_prefix }}docker-hosted"
          - "{{ repo_prefix }}docker-proxy"
      docker:
        v1Enabled: false
        forceBasicAuth: true
    status_code: 201
  when: docker_group.status == 404



