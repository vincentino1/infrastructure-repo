- name: Set Nexus repository variables
  ansible.builtin.set_fact:
    repo_prefix: "myapp-"
    docker_port: 5000            
    nexus_admin_user: "admin"
    nexus_admin_pass: "{{ nexus_password.stdout | default('admin123') }}"
    nexus_private_ip: "{{ ansible_host }}"
    nexus_base_url: "http://{{ nexus_private_ip }}:8081"
    nexus_repo_api: "{{ nexus_base_url }}/service/rest/v1/repositories"


# Maven Repositories
- name: Check maven-hosted repo
  uri:
    url: "{{ nexus_repo_api }}/maven-hosted/{{ repo_prefix }}maven-hosted"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: maven_hosted
  changed_when: false

- name: Create maven-hosted
  uri:
    url: "{{ nexus_repo_api }}/maven/hosted"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ repo_prefix }}maven-hosted"
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: true
        writePolicy: ALLOW
      maven:
        versionPolicy: MIXED
        layoutPolicy: STRICT
    status_code: 201
  when: maven_hosted.status == 404

- name: Check maven-proxy repo
  uri:
    url: "{{ nexus_repo_api }}/maven-proxy/{{ repo_prefix }}maven-proxy"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: maven_proxy
  changed_when: false

- name: Create maven-proxy
  uri:
    url: "{{ nexus_repo_api }}/maven/proxy"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ repo_prefix }}maven-proxy"
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: true
      proxy:
        remoteUrl: https://repo1.maven.org/maven2/
        contentMaxAge: 1440
        metadataMaxAge: 1440
      negativeCache:
        enabled: true
        timeToLive: 1440
      maven:
        versionPolicy: MIXED
        layoutPolicy: STRICT
    status_code: 201
  when: maven_proxy.status == 404

- name: Check maven-group repo
  uri:
    url: "{{ nexus_repo_api }}/maven-group/{{ repo_prefix }}maven-group"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: maven_group
  changed_when: false

- name: Create maven-group
  uri:
    url: "{{ nexus_repo_api }}/maven/group"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ repo_prefix }}maven-group"
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: true
      group:
        memberNames:
          - "{{ repo_prefix }}maven-hosted"
          - "{{ repo_prefix }}maven-proxy"
    status_code: 201
  when: maven_group.status == 404

