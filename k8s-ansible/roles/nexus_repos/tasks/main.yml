# Maven Repositories
- name: Create myapp-maven-hosted
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/maven/hosted"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    body_format: json
    body: |
      {
        "name": "{{ repo_prefix }}maven-hosted",
        "online": true,
        "storage": { "blobStoreName": "default", "strictContentTypeValidation": true, "writePolicy": "ALLOW" },
        "maven": { "versionPolicy": "MIXED", "layoutPolicy": "STRICT", "contentDisposition": "INLINE" }
      }
    status_code: [201, 400]
    force_basic_auth: true

- name: Create myapp-maven-proxy
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/maven/proxy"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    body_format: json
    body: |
      {
        "name": "{{ repo_prefix }}maven-proxy",
        "online": true,
        "storage": { "blobStoreName": "default", "strictContentTypeValidation": true },
        "proxy": { "remoteUrl": "https://repo1.maven.org/maven2/", "contentMaxAge": 1440, "metadataMaxAge": 1440 },
        "negativeCache": { "enabled": true, "timeToLive": 1440 },
        "httpClient": { "blocked": false, "autoBlock": true },
        "maven": { "versionPolicy": "MIXED", "layoutPolicy": "STRICT" }
      }
    status_code: [201, 400]
    force_basic_auth: true
  

- name: Create myapp-maven-group
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/maven/group"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    body_format: json
    body: |
      {
        "name": "{{ repo_prefix }}maven-group",
        "online": true,
        "storage": { "blobStoreName": "default", "strictContentTypeValidation": true },
        "group": { "memberNames": ["{{ repo_prefix }}maven-hosted", "{{ repo_prefix }}maven-proxy"] },
        "maven": { "versionPolicy": "MIXED", "layoutPolicy": "STRICT" }
      }
    status_code: [201, 400]
    force_basic_auth: true


