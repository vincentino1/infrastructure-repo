- name: Create Docker certs directory for registry
  ansible.builtin.file:
    path: "{{ docker_certs_dir }}"
    state: directory
    mode: '0755'

- name: Copy certificate to Docker trust store (as ca.crt)
  ansible.builtin.copy:
    src: "{{ cert_src }}"
    dest: "{{ docker_certs_dir }}/ca.crt"
    owner: root
    group: root
    mode: '0644'
    remote_src: yes

- name: Copy Nexus certificate to system CA directory (for Jenkins)
  ansible.builtin.copy:
    src: "{{ cert_src }}"
    dest: /usr/local/share/ca-certificates/nexus.crt
    owner: root
    group: root
    mode: '0644'
    remote_src: yes

- name: Update system CA certificates
  ansible.builtin.command: update-ca-certificates
  register: ca_update
  changed_when: "'n updated' in ca_update.stdout"

- name: Restart Docker service to apply new trust
  ansible.builtin.service:
    name: docker
    state: restarted
  when: ca_update.changed

- name: Verify Docker can access registry
  ansible.builtin.shell: |
    echo "{{ docker_registry_password }}" | docker login {{ registry_domain }} -u "{{ docker_registry_username }}" --password-stdin
  register: login_result
  changed_when: false
  failed_when: "'Login Succeeded' not in login_result.stdout"
