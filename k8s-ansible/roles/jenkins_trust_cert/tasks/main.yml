
    - name: Create Docker certs directory
      ansible.builtin.file:
        path: "{{ docker_certs_dir }}"
        state: directory
        mode: '0755'

    - name: Copy Nexus certificate from bastion to Docker trust store
      ansible.builtin.copy:
        src: /tmp/nexus.crt      # copy from bastion (controller)
        dest: "{{ docker_certs_dir }}/ca.crt"
        owner: root
        group: root
        mode: '0644'

    - name: Copy Nexus certificate to system CA directory
      ansible.builtin.copy:
        src: /tmp/nexus.crt
        dest: /usr/local/share/ca-certificates/nexus.crt
        owner: root
        group: root
        mode: '0644'

    - name: Update system CA certificates
      ansible.builtin.command: update-ca-certificates

    - name: Restart Docker to apply trust
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Verify Docker login
      ansible.builtin.shell: |
        echo "{{ docker_registry_password }}" | docker login {{ registry_domain }} -u "{{ docker_registry_username }}" --password-stdin
      register: docker_login
      changed_when: false
      failed_when: "'Login Succeeded' not in docker_login.stdout"
