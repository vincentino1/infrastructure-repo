- name: Create Docker certs directory
  ansible.builtin.file:
    path: "{{ docker_certs_dir }}"
    state: directory
    mode: '0755'

- name: Copy Nexus certificate from bastion to Docker trust store
  ansible.builtin.copy:
    src: /tmp/nexus.crt
    dest: "{{ docker_certs_dir }}/ca.crt"
    owner: root
    group: root
    mode: '0644'

- name: Copy Nexus certificate to system CA directory
  ansible.builtin.copy:
    src: /tmp/nexus.crt
    dest: /usr/local/share/ca-certificates/nexus.crt
    owner: root
    group: root
    mode: '0644'

- name: Update system CA certificates
  ansible.builtin.command: update-ca-certificates
  changed_when: false

- name: Restart Docker to apply trust
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Login to Docker registry
  community.docker.docker_login:
    registry_url: {{ registry_domain }}
    username: "{{ docker_registry_username }}"
    password: "{{ docker_registry_password }}"
  register: docker_login
  changed_when: false
