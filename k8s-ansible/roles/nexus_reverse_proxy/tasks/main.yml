---
# 1. Install NGINX + Certbot
- name: Install required packages
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: yes

# 2. Remove default site
- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload NGINX

- name: Ensure Certbot webroot exists
  ansible.builtin.file:
    path: /var/lib/letsencrypt
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

# 3. Deploy HTTP-only config
- name: Deploy initial HTTP-only NGINX config 
  ansible.builtin.template: 
    src: nexus-http.conf.j2
    dest: /etc/nginx/sites-available/nexus.conf 
    mode: "0644" 
  notify: Reload NGINX

- name: Enable NGINX site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/nexus.conf
    dest: /etc/nginx/sites-enabled/nexus.conf
    state: link
    force: yes
  notify: Reload NGINX

- name: Ensure NGINX is started and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: yes

- name: Flush handlers so HTTP config is active
  meta: flush_handlers

# 5. Obtain Let's Encrypt certificate and update NGINX config
- name: Obtain Let's Encrypt certificate
  ansible.builtin.command: >
    certbot certonly --webroot
    --non-interactive
    --agree-tos
    --email {{ letsencrypt_email }}
    -w /var/lib/letsencrypt
    -d {{ registry_domain }}
  args:
    creates: "/etc/letsencrypt/live/{{ registry_domain }}/fullchain.pem"

- name: Deploy HTTPS config
  template:
    src: nexus-https.conf.j2
    dest: /etc/nginx/sites-available/nexus.conf
  notify: Reload NGINX

# 4. Validate NGINX configuration before reloading
- name: Test NGINX configuration
  ansible.builtin.command: nginx -t
  register: nginx_test
  changed_when: false
  failed_when: nginx_test.rc != 0


- name: Apply final NGINX configuration
  meta: flush_handlers

# 7. Enable auto-renewal of certificates
- name: Enable Certbot auto-renew
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: yes
