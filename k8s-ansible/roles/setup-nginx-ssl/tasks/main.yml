- name: Install required packages
  ansible.builtin.apt:
    name:
      - nginx
      - openssl
      - openjdk-17-jre-headless  # minimal Java - provides keytool without full JDK
    state: present
    update_cache: yes

- name: Create NGINX directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/nginx/certs
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled

- name: Generate self-signed PKCS12 keystore using keytool (Sonatype recommended)
  ansible.builtin.command: >
    keytool -genkeypair
    -keystore /etc/nginx/certs/nexus-keystore.p12
    -storetype PKCS12
    -storepass {{ keystore_pass }}
    -keypass {{ keystore_pass }}
    -alias {{ key_alias | default('nexus') }}
    -keyalg RSA
    -keysize 2048
    -validity 730
    -dname "CN=*.{{ registry_domain }}, OU=DevOps, O=Local, L=Calgary, S=Alberta, C=CA"
    -ext "SAN=DNS:{{ registry_domain }},IP:{{ nexus_server_ip }}"
  args:
    creates: /etc/nginx/certs/nexus-keystore.p12
  register: keystore_generation
  changed_when: keystore_generation.rc == 0
  

- name: Export public certificate in PEM format
  ansible.builtin.command: >
    keytool -exportcert
    -alias {{ key_alias | default('nexus') }}
    -keystore /etc/nginx/certs/nexus-keystore.p12
    -storepass {{ keystore_pass }}
    -rfc
    -file /etc/nginx/certs/nexus.crt
  args:
    creates: /etc/nginx/certs/nexus.crt



- name: Export private key (unencrypted PEM format for NGINX)
  ansible.builtin.command: >
    openssl pkcs12
    -in /etc/nginx/certs/nexus-keystore.p12
    -nocerts
    -nodes
    -passin pass:{{ keystore_pass }}
    -out /etc/nginx/certs/nexus.key
  args:
    creates: /etc/nginx/certs/nexus.key

- name: Set strict permissions on certificate files
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - { path: /etc/nginx/certs/nexus.key, mode: '0600' }
    - { path: /etc/nginx/certs/nexus.crt, mode: '0644' }
    - { path: /etc/nginx/certs/nexus-keystore.p12, mode: '0600' }

- name: Copy Nexus certificate to system CA directory
  ansible.builtin.copy:
    src: /etc/nginx/certs/nexus.crt
    dest: /usr/local/share/ca-certificates/nexus.crt
    owner: root
    group: root
    mode: '0644'
    remote_src: yes
  register: cert_copy
  

- name: Update system CA certificates
  ansible.builtin.command: update-ca-certificates
  when: cert_copy.changed

- name: Create NGINX configuration file for Nexus (with Docker support)
  ansible.builtin.template:
    src: nexus-nginx.conf.j2
    dest: /etc/nginx/sites-available/nexus.conf
    mode: '0644'
    owner: root
    group: root
  notify: Reload NGINX

- name: Enable NGINX site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/nexus.conf
    dest: /etc/nginx/sites-enabled/nexus.conf
    state: link
    force: yes
  notify: Reload NGINX

# On proxy-server
- name: Fetch Nexus certificate to controller
  ansible.builtin.fetch:
    src: /etc/nginx/certs/nexus.crt
    dest: /tmp/nexus.crt
    flat: yes

- name: Remove default NGINX site if present
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload NGINX

- name: Test NGINX configuration
  ansible.builtin.command: nginx -t
  register: nginx_test
  changed_when: false
  failed_when: nginx_test.rc != 0

- name: Ensure NGINX is started and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: yes
    daemon_reload: yes
