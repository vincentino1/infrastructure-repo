---
- name: Set variables for Nexus security configuration
  ansible.builtin.set_fact:
    nexus_admin_user: "admin"
    nexus_admin_pass: "{{ nexus_password.stdout | default('admin123') }}" 
    repo_prefix: "myapp-"                                               
    developer_username: "{{ your_developer_username | default('myapp-developer') }}"
    developer_password: "{{ your_developer_password | default('ChangeMeSecure123!') }}"  # Use Ansible Vault!
    developer_email: "{{ your_developer_email | default('myapp-developer@yourcompany.com') }}"

- name: Check if role 'myapp-developer' already exists
  ansible.builtin.uri:
    url: "{{ nexus_api_base_url }}/service/rest/v1/security/roles/myapp-developer"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    status_code: [200, 404]
    return_content: yes
  register: role_check
  changed_when: false

- name: Create role 'myapp-developer' (read from all repos + deploy to hosted)
  ansible.builtin.uri:
    url: "{{ nexus_base_url }}/service/rest/v1/security/roles"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    body_format: json
    body: >-
      {
        "id": "myapp-developer",
        "name": "MyApp Developer",
        "description": "Can browse/read everything + deploy/edit/delete to hosted repositories",
        "source": "default",
        "privileges": [
          "nx-repository-view-*-browse",
          "nx-repository-view-*-read",
          "nx-repository-view-*-add",
          "nx-repository-view-*-edit",
          "nx-repository-view-*-delete"
        ],
        "roles": []
      }
    status_code: [201]
    force_basic_auth: true
    return_content: yes
  when: role_check.status == 404
  register: role_creation

- name: Check if developer user already exists
  ansible.builtin.uri:
    url: "{{ nexus_api_base_url }}/service/rest/v1/security/users/{{ developer_username }}"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    status_code: [200, 404]
    return_content: yes
  register: user_check
  changed_when: false

- name: Create dedicated developer user and assign role
  ansible.builtin.uri:
    url: "{{ nexus_api_base_url }}/service/rest/v1/security/users/"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    body_format: json
    body: |
      {
        "userId": "{{ developer_username }}",
        "firstName": "MyApp",
        "lastName": "Developer",
        "emailAddress": "{{ developer_email }}",
        "source": "default",
        "status": "active",
        "readOnly": false,
        "externalRoles": [],
        "roles": ["myapp-developer"],
        "password": "{{ developer_password }}"
      }
    status_code: [201]
    force_basic_auth: true
    return_content: yes
  when: user_check.status == 404
  register: user_creation
  changed_when: user_check.status == 404

- name: Warn about new user credentials (change password immediately!)
  ansible.builtin.debug:
    msg: >
      New user '{{ developer_username }}' was created.
      Initial password: {{ developer_password }}
      → Change it immediately via UI or API!
  when: user_creation.changed