---
- name: Set variables for Nexus security configuration
  ansible.builtin.set_fact:
    nexus_admin_user: "admin"
    nexus_admin_pass: "{{ nexus_password.stdout | default('admin123') }}"
    repo_prefix: "myapp-"
    developer_username: "{{ your_developer_username | default('myapp-developer-role') }}"
    developer_password: "{{ your_developer_password | default('ChangeMeSecure123!') }}"
    developer_email: "{{ your_developer_email | default('myapp-developer@yourcompany.com') }}"
    nexus_api_url: "{{ nexus_base_url }}/service/rest/v1"

- name: Check if role 'myapp-developer-role' exists
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/security/roles/myapp-developer-role"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    status_code: [200, 404]
    return_content: yes
  register: role_check
  changed_when: false

- name: Create role 'myapp-developer-role'
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/security/roles"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      id: "myapp-developer-role"
      name: "myapp-developer-role"
      description: "Developer access to myapp repos"
      privileges:
        - "nx-repository-view-maven2-myapp-maven-hosted-read"
        - "nx-repository-view-maven2-myapp-maven-hosted-browse"
        - "nx-repository-view-maven2-myapp-maven-proxy-read"
        - "nx-repository-view-maven2-myapp-maven-proxy-browse"
        - "nx-repository-view-maven2-myapp-maven-group-read"
        - "nx-repository-view-maven2-myapp-maven-group-browse"
        - "nx-repository-view-npm-myapp-npm-hosted-read"
        - "nx-repository-view-npm-myapp-npm-hosted-browse"
        - "nx-repository-view-npm-myapp-npm-proxy-read"
        - "nx-repository-view-npm-myapp-npm-proxy-browse"
        - "nx-repository-view-npm-myapp-npm-group-read"
        - "nx-repository-view-npm-myapp-npm-group-browse"
        - "nx-repository-view-docker-myapp-docker-hosted-read"
        - "nx-repository-view-docker-myapp-docker-hosted-browse"
        - "nx-repository-view-docker-myapp-docker-hosted-add"
        - "nx-repository-view-docker-myapp-docker-hosted-edit"
        - "nx-repository-view-docker-myapp-docker-hosted-delete"
        - "nx-repository-view-docker-myapp-docker-proxy-read"
        - "nx-repository-view-docker-myapp-docker-proxy-browse"
        - "nx-repository-view-docker-myapp-docker-group-read"
        - "nx-repository-view-docker-myapp-docker-group-browse"

      roles: []
    status_code: [200, 201]
    return_content: yes
  when: role_check.status == 201

- name: Check if users exist
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/security/users"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    status_code: 200
    return_content: yes
  register: user_check
  changed_when: false

- name: Determine if jenkins user exists
  ansible.builtin.set_fact:
    jenkins_exists: "{{ 'jenkins' in (user_check.json | map(attribute='userId') | list) }}"

- name: Create developer user and assign role
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/security/users"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      userId: "{{ developer_username }}"
      firstName: "Jenkins"
      lastName: "CI"
      emailAddress: "{{ developer_email }}"
      source: "default"
      status: "active"
      readOnly: false
      externalRoles: []
      roles:
        - "myapp-developer-role"
      password: "{{ developer_password }}"
    return_content: yes
    status_code: [200, 201]
  register: user_creation
  when: not jenkins_exists
  changed_when: user_creation.status == 201

- name: Warn about new user credentials
  ansible.builtin.debug:
    msg: >
      New user '{{ developer_username }}' was created.
      Initial password: {{ developer_password }}
      → Change it immediately via UI or API!
  when: user_creation.changed

# ============================
# Enable Docker Bearer Token Realm
# ============================
- name: Get current active realms
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/security/realms/active"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    status_code: 200
    return_content: yes
  register: current_realms
  changed_when: false

- name: Ensure DockerToken realm is included
  ansible.builtin.set_fact:
    updated_realms: >-
      {{
        (current_realms.json + ['DockerToken'])
        | unique
      }}

- name: Enable Docker Bearer Token Realm
  ansible.builtin.uri:
    url: "{{ nexus_api_url }}/security/realms/active"
    method: PUT
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body: "{{ updated_realms }}"
    status_code: [200, 204]
  register: realm_update
  when: "'DockerToken' not in current_realms.json"
  changed_when: realm_update.status == 204
