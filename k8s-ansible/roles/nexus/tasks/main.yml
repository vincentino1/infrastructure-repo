---
- name: Install Java
  ansible.builtin.apt:
    name: openjdk-11-jdk
    state: present
    update_cache: yes

- name: Create nexus system user
  ansible.builtin.user:
    name: nexus
    system: yes
    shell: /bin/bash
    create_home: no
    state: present

- name: Download Nexus tarball
  ansible.builtin.get_url:
    url: "https://download.sonatype.com/nexus/3/nexus-3.89.0-09-linux-x86_64.tar.gz"
    dest: /tmp/nexus.tar.gz
    mode: "0644"
    checksum: sha256:3f0f49265ce24a6f79827ff706a75f204d6709324e8ab67d04a426d79a25e2fd
- name: Extract Nexus to /opt
  ansible.builtin.unarchive:
    src: /tmp/nexus.tar.gz
    dest: /opt
    remote_src: yes
    creates: /opt/nexus-3.
    owner: nexus
    group: nexus

- name: Find the actual Nexus directory
  ansible.builtin.find:
    paths: /opt
    patterns: "nexus-3.*"
    file_type: directory
  register: nexus_dirs

- name: Set fact for Nexus home
  ansible.builtin.set_fact:
    nexus_home: "{{ nexus_dirs.files | map(attribute='path') | first }}"

- name: Create symlink /opt/nexus → current version
  ansible.builtin.file:
    src: "{{ nexus_home }}"
    dest: /opt/nexus
    state: link
    force: yes
    owner: nexus
    group: nexus

- name: Ensure sonatype-work is owned by nexus
  ansible.builtin.file:
    path: /opt/sonatype-work
    state: directory
    owner: nexus
    group: nexus
    recurse: yes

- name: Configure run_as_user (create nexus.rc if missing)
  ansible.builtin.copy:
    dest: /opt/nexus/bin/nexus.rc
    content: |
      run_as_user="nexus"
    mode: "0644"
    owner: nexus
    group: nexus

- name: Create Nexus systemd service file
  ansible.builtin.copy:
    dest: /etc/systemd/system/nexus.service
    mode: "0644"
    content: |
      [Unit]
      Description=Sonatype Nexus Repository Manager
      After=network.target

      [Service]
      Type=forking
      LimitNOFILE=65536
      ExecStart=/opt/nexus/bin/nexus start
      ExecStop=/opt/nexus/bin/nexus stop
      User=nexus
      Group=nexus
      Restart=on-abort
      TimeoutSec=600

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable and start Nexus service
  ansible.builtin.systemd:
    name: nexus
    enabled: yes
    state: started

- name: Wait for Nexus to become available on port 8081
  ansible.builtin.wait_for:
    port: 8081
    delay: 30
    timeout: 300
    state: started

- name: Get Nexus admin password
  command: cat /opt/sonatype-work/nexus3/admin.password
  register: nexus_password
  ignore_errors: yes

- name: Display Nexus password
  debug:
    msg: "Nexus initial password: {{ nexus_password.stdout }}"
    when: nexus_password.stdout is defined