---
- name: Ensure Jenkins is started
  ansible.builtin.systemd:
    name: jenkins
    state: started
    enabled: yes

- name: Wait for Jenkins to be reachable
  ansible.builtin.uri:
    url: "{{ jenkins_url }}"
    status_code: [200, 403]
    timeout: 5
  register: jenkins_status
  retries: 60
  delay: 5
  until: "'status' in jenkins_status and jenkins_status.status in [200, 403]"

- name: Display Jenkins service status
  debug:
    msg: "Jenkins is up with status code {{ jenkins_status.status }}"

- name: Install Jenkins plugins
  community.general.jenkins_plugin:
    name: "{{ item }}"
    state: present
    url: "{{ jenkins_url }}"
    url_username: "{{ jenkins_admin_user }}"
    url_password: "{{ jenkins_admin_password }}"
    with_dependencies: true
  loop: "{{ jenkins_plugins }}"
  notify: Restart Jenkins

- name: Ensure init.groovy.d directory exists
  ansible.builtin.file:
    path: /var/lib/jenkins/init.groovy.d
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'

- name: Deploy credentials Groovy init script
  ansible.builtin.template:
    src: credentials.groovy.j2
    dest: /var/lib/jenkins/init.groovy.d/jenkins_creds.groovy
    owner: jenkins
    group: jenkins
    mode: '0644'
  notify: Restart Jenkins

- name: Create systemd override directory for Jenkins
  ansible.builtin.file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    mode: '0755'

- name: Create Groovy init script for global env vars
  ansible.builtin.copy:
    dest: /var/lib/jenkins/init.groovy.d/global-env.groovy
    content: |
      import jenkins.model.*
      import hudson.slaves.EnvironmentVariablesNodeProperty

      def instance = Jenkins.instance
      def envVarsNodePropertyList = instance.globalNodeProperties.getAll(EnvironmentVariablesNodeProperty.class)
      def envVars = envVarsNodePropertyList ? envVarsNodePropertyList[0].envVars : new java.util.HashMap()
      envVars.put("NEXUS_URL", "{{ nexus_url }}")
      if (!envVarsNodePropertyList) {
          def newNodeProp = new EnvironmentVariablesNodeProperty(new hudson.slaves.EnvironmentVariablesNodeProperty.Entry("NEXUS_URL", "{{ nexus_url }}"))
          instance.globalNodeProperties.add(newNodeProp)
      }
      instance.save()
  notify:
    - Restart Jenkins


- name: Wait for Jenkins to be ready after restart
  ansible.builtin.uri:
    url: "{{ jenkins_url }}"
    status_code: [200, 403]
    timeout: 5
  register: jenkins_status_after
  retries: 60
  delay: 5
  until: "'status' in jenkins_status_after and jenkins_status_after.status in [200, 403]"

- name: Display Jenkins service status after restart
  debug:
    msg: "Jenkins is up after restart with status code {{ jenkins_status_after.status }}"
