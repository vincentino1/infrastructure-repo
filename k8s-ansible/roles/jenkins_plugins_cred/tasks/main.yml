---
- name: Install Jenkins plugins
  community.general.jenkins_plugin:
    name: "{{ item }}"
    state: present
    url: "{{ jenkins_url }}"
    url_username: "{{ jenkins_admin_user }}"
    url_password: "{{ jenkins_admin_password }}"
    with_dependencies: true
  loop: "{{ jenkins_plugins}}"
  notify: Restart Jenkins

- name: Deploy credentials Groovy init script
  template:
    src: credentials.groovy.j2
    dest: /var/lib/jenkins/init.groovy.d/01-credentials.groovy
    owner: jenkins
    group: jenkins
    mode: '0644'
  notify: restart jenkins

- name: Wait for Jenkins to start up
  ansible.builtin.uri:
    url: "{{ jenkins_url }}"
    status_code: 
     - 200
     - 403
    timeout: 5
  register: jenkins_service_status
  retries: 60
  delay: 5
  until: >
        'status' in jenkins_service_status and
        jenkins_service_status['status'] in [200, 403]
