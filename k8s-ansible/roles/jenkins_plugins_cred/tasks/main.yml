- name: Ensure community.general collection is installed
  ansible.builtin.command: ansible-galaxy collection install community.general
  changed_when: false
  check_mode: no

- name: Generate long-lived API token (only needs to run once)
  community.general.jenkins_credential:
    url: "{{ jenkins_url }}"
    jenkins_user: "{{ jenkins_admin_user }}"
    jenkins_password: "{{ jenkins_admin_password }}"
    type: token
    name: "ansible-automation-token"
    state: present
  register: token_result
  no_log: true   # hide token in logs   
  when: not lookup('env', 'JENKINS_API_TOKEN')   # skip if token already in env

- name: Show generated token (run once, then remove or mask!)
  ansible.builtin.debug:
    msg: "Token generated: {{ token_result.token | default('already exists') }}"
  when: token_result.changed

- name: Create username/password credential using token
  community.general.jenkins_credential:
    url: "{{ jenkins_url }}"
    token: "{{ token_result.token | default(lookup('env', 'JENKINS_API_TOKEN')) }}"  # fallback for future runs
    id: "my-deploy-cred"
    type: user_and_pass
    description: "Deploy user for app"
    username: "deployer"
    password: "secret123"
    state: present
  register: cred_result

- name: Debug credential creation result
  ansible.builtin.debug:
    msg: |
      Changed:   {{ cred_result.changed }}
      Failed:    {{ cred_result.failed | default(false) }}
      Details:   {{ cred_result.details | default('none') }}
      Message:   {{ cred_result.msg | default('success') }}

- name: Fail if credential creation failed
  ansible.builtin.fail:
    msg: "Credential creation failed: {{ cred_result.details | default('unknown error') }}"
  when: cred_result.failed


- name: Create Groovy init script for global env vars
  ansible.builtin.copy:
    dest: /var/lib/jenkins/init.groovy.d/global-env.groovy
    content: |
      import jenkins.model.*
      import hudson.slaves.EnvironmentVariablesNodeProperty

      def instance = Jenkins.instance
      def envVarsNodePropertyList = instance.globalNodeProperties.getAll(EnvironmentVariablesNodeProperty.class)
      def envVars = envVarsNodePropertyList ? envVarsNodePropertyList[0].envVars : new java.util.HashMap()
      envVars.put("NEXUS_URL", "{{ nexus_url }}")
      if (!envVarsNodePropertyList) {
          def newNodeProp = new EnvironmentVariablesNodeProperty(new hudson.slaves.EnvironmentVariablesNodeProperty.Entry("NEXUS_URL", "{{ nexus_url }}"))
          instance.globalNodeProperties.add(newNodeProp)
      }
      instance.save()
  notify:
    - Restart Jenkins


- name: Wait for Jenkins to be ready after restart
  ansible.builtin.uri:
    url: "{{ jenkins_url }}"
    status_code: [200, 403]
    timeout: 5
  register: jenkins_status_after
  retries: 60
  delay: 5
  until: "'status' in jenkins_status_after and jenkins_status_after.status in [200, 403]"

- name: Display Jenkins service status after restart
  debug:
    msg: "Jenkins is up after restart with status code {{ jenkins_status_after.status }}"
