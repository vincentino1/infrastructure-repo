- name: Ensure Jenkins is started
  ansible.builtin.systemd:
    name: jenkins
    state: started
    enabled: yes

- name: Wait for Jenkins to be reachable
  ansible.builtin.uri:
    url: "{{ jenkins_url }}"
    status_code: [200, 403]
    timeout: 5
  register: jenkins_status
  retries: 60
  delay: 5
  until: "'status' in jenkins_status and jenkins_status.status in [200, 403]"

- name: Display Jenkins service status
  debug:
    msg: "Jenkins is up with status code {{ jenkins_status.status }}"

- name: Install Jenkins plugins
  community.general.jenkins_plugin:
    name: "{{ item }}"
    state: present
    url: "{{ jenkins_url }}"
    url_username: "{{ jenkins_admin_user }}"
    url_password: "{{ jenkins_admin_password }}"
    with_dependencies: true
  loop: "{{ jenkins_plugins }}"
  notify: Restart Jenkins

- name: Ensure init.groovy.d directory exists
  ansible.builtin.file:
    path: /var/lib/jenkins/init.groovy.d
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'

