- name: Initialize Kubernetes cluster
  command: >
    kubeadm init
    --pod-network-cidr={{ k8s_cluster_cidr }}
    --service-cidr={{ k8s_service_cidr }}
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --control-plane-endpoint={{ ansible_default_ipv4.address }}:6443
    --upload-certs
  register: kubeadm_init
  retries: 2
  delay: 10
  until: kubeadm_init.rc == 0
  args:
    creates: /etc/kubernetes/admin.conf


- name: Create .kube directory for admin user
  file:
    path: /home/{{ k8s_user }}/.kube
    state: directory
    mode: '0755'
    owner: "{{ k8s_user }}"
    group: "{{ k8s_user }}"

- name: Copy admin.conf to user kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ k8s_user }}/.kube/config
    remote_src: yes
    owner: "{{ k8s_user }}"
    group: "{{ k8s_user }}"
    mode: '0644'

- name: Check if node already part of the cluster
  command: kubectl get nodes --no-headers -o custom-columns=NAME:.metadata.name
  register: kubectl_get_nodes
  delegate_to: "{{ groups['k8s_master'][0] }}"
  failed_when: false
  changed_when: false
  environment:
    KUBECONFIG: /home/{{ k8s_user }}/.kube/config

- name: Skip join if node already part of the cluster 
  debug:
    msg: "Node {{ inventory_hostname }} is already part of the cluster. Skipping join."
  when: inventory_hostname in kubectl_get_nodes.stdout_lines

- name: Generate join command on master
  command: kubeadm token create --print-join-command --ttl 24h
  register: join_command
  run_once: true
  delegate_to: "{{ groups['k8s_master'][0] }}"
  changed_when: false   

- name: Install Calico CNI
  become: yes
  become_user: "{{ k8s_user }}"
  command: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
  environment:
    KUBECONFIG: /home/{{ k8s_user }}/.kube/config
  run_once: true

- name: Save join command for workers
  set_fact:
    join_command: "{{ join_command.stdout }}"
  run_once: true

